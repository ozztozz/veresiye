{% load static %}
<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çıkış Yapıldı - Veresiye</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <script>
    const theme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</head>
<body class="min-h-screen app-bg-light text-slate-800">

  <!-- Navbar -->
  <header class="navbar glass-panel px-4 border-b border-[#62b6cb]/20 shadow-xs">
    <div class="flex-1">
      <span class="text-xl font-black text-[#1b4965]">Veresiye</span>
    </div>
  </header>

  <!-- Hero / Logout Card -->
  <div class="hero min-h-[calc(100vh-4rem)]">
    <div class="hero-content flex-col w-full max-w-md text-center">

      <!-- Icon -->
      <div class="avatar placeholder mb-2">
        <div class="badge-payment rounded-full w-16 h-16 flex items-center justify-center border border-[#62b6cb]/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-[#2d7587]" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
          </svg>
        </div>
      </div>

      <div class="glass-card w-full shadow-xl rounded-3xl border border-[#62b6cb]/20">
        <div class="card-body items-center gap-4 p-6">

          <div class="badge-payment w-full p-3 rounded-2xl flex items-center justify-center gap-2 border border-[#62b6cb]/30">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5 text-[#2d7587]" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span class="text-sm font-bold text-[#1b4965]">Oturumunuz başarıyla kapatıldı.</span>
          </div>

          <h2 class="card-title text-2xl font-black text-[#1b4965]">Güle Güle!</h2>
          <p class="text-[#1b4965]/70 text-sm">Tekrar görüşmek üzere.</p>

          <div class="card-actions w-full flex-col gap-2 mt-2">
            <a href="{% url 'login' %}" class="btn btn-debt w-full rounded-2xl h-12 font-bold shadow-xs">
              Tekrar Giriş Yap
            </a>
          </div>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
