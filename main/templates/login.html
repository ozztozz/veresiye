{% load static %}
<!DOCTYPE html>
<html lang="tr" data-theme="coffee">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Giriş Yap - Veresiye</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}" />
  <script>
    const theme = localStorage.getItem('theme') || 'coffee';
    document.documentElement.setAttribute('data-theme', theme);
  </script>
</head>
<body class="min-h-screen bg-base-200">

  <!-- Navbar -->
  <div class="navbar bg-base-100 shadow-sm px-4">
    <div class="flex-1">
      <span class="text-xl font-bold text-primary">Veresiye</span>
    </div>
  </div>

  <!-- Hero / Login Card -->
  <div class="hero min-h-[calc(100vh-4rem)]">
    <div class="hero-content flex-col w-full max-w-md">

      <!-- Logo / Title -->
      <div class="text-center mb-2">
        <div class="avatar placeholder mb-3">
          <div class="bg-primary text-primary-content rounded-full w-16 flex items-center justify-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-9 w-9" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
        </div>
        <h1 class="text-3xl font-bold">Hoş Geldiniz</h1>
        <p class="text-base-content/60 mt-1 text-sm">Devam etmek için giriş yapın</p>
      </div>

      <!-- Card -->
      <div class="card w-full shadow-2xl bg-base-100 border border-base-300">
        <div class="card-body gap-4">

          {% if form.errors %}
          <div class="alert alert-error">
            <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>Kullanıcı adı veya şifre hatalı.</span>
          </div>
          {% endif %}

          {% if messages %}
          {% for message in messages %}
          <div class="alert alert-{{ message.tags|default:'info' }}">
            <span>{{ message }}</span>
          </div>
          {% endfor %}
          {% endif %}

          <form method="post" class="space-y-4">
            {% csrf_token %}

            <!-- Username -->
            <div class="form-control">
              <label class="label pb-1">
                <span class="label-text font-medium">Kullanıcı Adı</span>
              </label>
              <label class="input input-bordered flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
                <input type="text" name="username" class="grow" placeholder="Kullanıcı adınızı girin" required autocomplete="username" />
              </label>
            </div>

            <!-- Password -->
            <div class="form-control">
              <label class="label pb-1">
                <span class="label-text font-medium">Şifre</span>
              </label>
              <label class="input input-bordered flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                </svg>
                <input type="password" name="password" class="grow" placeholder="Şifrenizi girin" required autocomplete="current-password" />
              </label>
            </div>

            <!-- Submit -->
            <div class="form-control mt-2">
              <button type="submit" class="btn btn-primary w-full">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                </svg>
                Giriş Yap
              </button>
            </div>
          </form>

        </div>
      </div>

    </div>
  </div>

</body>
</html>
