{% extends "base.html" %}
{% block content %}



<div class="flex flex-col items-center justify-center mb-4 md:mb-8">
    <h1 class="text-2xl md:text-4xl font-bold mb-4">Blok ve Numaralar</h1>
</div>
 <div class="grid grid-cols-5  gap-2 md:gap-4"> 
    {% for blok in blok_list %}
   <button role="button" class="btn btn-accent w-full text-sm md:text-base min-h-0 h-auto py-3"
   hx-get="{% url 'main:htmx_apartment_list' blok=blok %}"
   hx-target="#apartment_list"
    hx-swap="innerHTML"
   >{{ blok }}</button>
    {% endfor %}
</div>
<div id="apartment_list"></div>

{% endblock content %}
