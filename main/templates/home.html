{% extends "base.html" %}
{% block content %}



<!-- Main Content -->
<div class="max-w-7xl mx-auto">

    <!-- Tabs -->
    <div role="tablist" class="tabs tabs-border tabs-lg">

        <!-- Tab 1: Ana Bloklar -->
        <input type="radio" name="block_tabs" role="tab" class="tab  font-semibold" aria-label="Can Ata Bilge" checked />
        <div role="tabpanel" class="tab-content bg-base-100 border-base-300 rounded-box p-4">
            <div class="flex items-center justify-between mb-3">

                <div class="badge badge-accent gap-1">{{ blok_list|length }} Blok</div>
            </div>
            <div class="divider my-2"></div>
            <div class="grid grid-cols-5 gap-2 md:gap-3">
                {% for blok in blok_list %}
                <button role="button"
                    class="btn btn-accent hover:btn-primary w-full text-sm md:text-base min-h-0 h-auto py-3
                           transform hover:scale-105 transition-all duration-150 shadow-sm hover:shadow-md font-semibold"
                    hx-get="{% url 'main:htmx_apartment_list' blok=blok %}"
                    hx-target="#apartment_list"
                    hx-swap="innerHTML swap:0.2s"
                    hx-indicator="#loading-indicator">
                    {{ blok }}
                </button>
                {% endfor %}
            </div>
        </div>

        <!-- Tab 2: Diğer Bloklar -->


    </div>

    <!-- Apartment List -->
    <div id="apartment_list" class="mt-6"></div>

</div>

<!-- Loading Indicator -->
<div id="loading-indicator" class="htmx-indicator fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
    <div class="alert alert-info shadow-2xl">
        <span class="loading loading-spinner loading-md"></span>
        <span class="font-medium">Yükleniyor...</span>
    </div>
</div>

<!-- Empty State (optional, shown when no selection) -->
<div class="text-center py-12 opacity-50">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto mb-4 text-base-content/30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
    </svg>
    <p class="text-base-content/50 text-sm">Daire listesini görüntülemek için bir blok seçin</p>
</div>

<!-- Smooth Transitions -->
<style>
    .htmx-swapping {
        opacity: 0;
        transition: opacity 0.2s ease-out;
    }
    .htmx-settling {
        opacity: 1;
        transition: opacity 0.2s ease-in;
    }
    .htmx-indicator {
        opacity: 0;
        transition: opacity 0.2s ease-in;
    }
    .htmx-request .htmx-indicator {
        opacity: 1;
    }
</style>

{% endblock content %}
