{% extends "base.html" %}

{% block content %}
<div class="space-y-6">
  <div class="flex justify-between items-center">
    <h1 class="text-3xl font-bold">İşlemler</h1>
    <button 
      class="btn btn-primary"
      hx-get="{% url 'main:transaction_form' %}"
      hx-target="#modal-container"
      hx-swap="innerHTML"
      hx-on::afterSettle="document.getElementById('transaction-modal').classList.add('modal-open')"
    >
      + İşlem Ekle
    </button>
  </div>

  <!-- Transactions List (HTMX replaceable) -->
  <div id="transactions-list">
    {% include "transaction_list.html" %}
  </div>
</div>
{% endblock content %}
