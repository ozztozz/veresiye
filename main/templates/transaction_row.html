<!-- Transaction Row (Partial for HTMX) -->
<tr id="transaction-{{ transaction.id }}" class="hover:bg-base-200">
  <td class="font-semibold">{{ transaction.apartment }}</td>
  <td>₺{{ transaction.amount }}</td>
  <td>{{ transaction.get_payment_method_display }}</td>
  <td>
    {% if transaction.paid %}
      <span class="badge badge-success">Ödendi</span>
    {% else %}
      <span class="badge badge-warning">Bekleniyor</span>
    {% endif %}
  </td>
  <td>{{ transaction.date|date:"d.m.Y" }}</td>
  <td class="space-x-2">
    <button 
      class="btn btn-sm btn-ghost"
      hx-get="{% url 'main:transaction_row_edit' transaction.id %}"
      hx-target="#transaction-{{ transaction.id }}"
      hx-swap="outerHTML"
    >
      Düzenle
    </button>
    <button 
      class="btn btn-sm btn-error btn-outline"
      hx-post="{% url 'main:transaction_delete' transaction.id %}"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
      hx-confirm="Bu işlemi silmek istediğinizden emin misiniz?"
      hx-target="#transaction-{{ transaction.id }}"
      hx-swap="outerHTML swap:0.5s"
    >
      Sil
    </button>
  </td>
</tr>
