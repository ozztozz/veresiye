{% extends "base.html" %}

{% block title %}Çevrimdışı - Veresiye{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center text-center px-4 py-12">
    <div class="w-24 h-24 rounded-full bg-warning/10 text-warning flex items-center justify-center mb-6 shadow-lg animate-pulse">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414" />
        </svg>
    </div>

    <h2 class="text-2xl sm:text-3xl font-extrabold mb-2 text-base-content">İnternet Bağlantısı Yok</h2>
    <p class="text-base-content/70 max-w-sm text-sm sm:text-base mb-8">
        Şu anda çevrimdışısınız. Bağlantınız geldiğinde işlemlerinizi yapmaya devam edebilirsiniz.
    </p>

    <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
        <button onclick="window.location.reload()" class="btn btn-primary w-full gap-2 shadow-md">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Yeniden Dene
        </button>
        <a href="/" class="btn btn-outline w-full gap-2">
            Ana Sayfa
        </a>
    </div>
</div>
{% endblock %}
