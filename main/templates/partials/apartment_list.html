<div class="card bg-base-100 shadow-md border border-base-300 rounded-2xl overflow-hidden animate-fadeIn">
    <div class="card-body p-3.5 sm:p-5">
        <div class="flex items-center justify-between">
            <h3 class="font-extrabold text-base sm:text-lg flex items-center gap-2">
                <span class="badge badge-primary font-black px-2.5 py-1">{{ blok }} Blok</span>
                <span>Daireleri</span>
            </h3>
            <span class="text-xs text-base-content/60 font-medium">Toplam {{ number_list|length }} daire</span>
        </div>
        
        <div class="divider my-2"></div>
        
        <div class="grid grid-cols-5 sm:grid-cols-5 md:grid-cols-5 lg:grid-cols-5 gap-2">
            {% for number in number_list %}
            <a href="{% url 'main:apartment_detail' apartment_number=blok|add:number %}" class="w-full">
                <button class="btn btn-outline hover:btn-primary w-full text-xs sm:text-sm min-h-0 h-11 rounded-xl shadow-xs app-touch-active font-bold transition-transform">
                    <span>{{ blok }}{{ number }}</span>
                </button>
            </a>
            {% endfor %}
        </div>
    </div>
</div>

<div id="alerts" hx-swap-oob="true"></div>
