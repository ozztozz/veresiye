<div class="card ui-bg-base-100 ui-shadow-md ui-border ui-border-base-300 ui-rounded-2xl ui-overflow-hidden ui-animate-fadeIn">
    <div class="card-body ui-p-3-5 ui-sm-p-5">
        <div class="ui-flex ui-items-center ui-justify-between">
            <h3 class="ui-font-extrabold ui-text-base ui-sm-text-lg ui-flex ui-items-center ui-gap-2">
                <span class="badge badge-primary ui-font-black ui-px-2-5 ui-py-1">{{ blok }} Blok</span>
                <span>Daireleri</span>
            </h3>
            <span class="ui-text-xs ui-text-base-content-60 ui-font-medium">Toplam {{ number_list|length }} daire</span>
        </div>
        
        <div class="divider ui-my-2"></div>
        
        <div class="ui-grid ui-grid-cols-5 ui-sm-grid-cols-5 ui-md-grid-cols-5 ui-lg-grid-cols-5 ui-gap-2">
            {% for number in number_list %}
            <a href="{% url 'main:apartment_detail' apartment_number=blok|add:number %}" class="ui-w-full">
                <button class="btn btn-outline ui-hover-btn-primary ui-w-full ui-text-xs ui-sm-text-sm ui-min-h-0 ui-h-11 ui-rounded-xl ui-shadow-xs app-touch-active ui-font-bold ui-transition-transform">
                    <span>{{ blok }}{{ number }}</span>
                </button>
            </a>
            {% endfor %}
        </div>
    </div>
</div>

<div id="alerts" hx-swap-oob="true"></div>
