{% load humanize %}
<div class="glass-card rounded-3xl border border-[#62b6cb]/20 shadow-sm overflow-hidden">
    <div class="card-body p-3.5 sm:p-5">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-[#1b4965] to-[#5fa8d3] text-white flex items-center justify-center font-black text-lg shadow-sm border border-white/20">
                    {{ apartment.number }}
                </div>
                <div>
                    <h2 class="text-lg sm:text-xl font-black text-[#1b4965] leading-tight">Daire {{ apartment.number }}</h2>
                    <p class="text-xs text-[#1b4965]/60 font-medium">Bakiye & Aidat Durumu</p>
                </div>
            </div>
            
            <div class="text-right">
                <span class="text-[11px] uppercase font-bold text-[#1b4965]/60 block">Güncel Bakiye</span>
                <span class="text-lg sm:text-2xl font-black {% if apartment.total_balance > 0 %}text-debt{% elif apartment.total_balance < 0 %}text-payment{% else %}text-[#1b4965]{% endif %}">
                    {{ apartment.total_balance|floatformat:2|intcomma }} ₺
                </span>
            </div>
        </div>
        
        <div class="divider my-1.5 opacity-20"></div>
        
        <!-- Stats Grid (Mobile 2-column) -->
        <div class="grid grid-cols-2 gap-2.5">
            <div class="p-3 badge-debt rounded-2xl border border-[#1b4965]/20">
                <div class="flex items-center justify-between text-[#1b4965] mb-1">
                    <span class="text-[11px] uppercase font-bold">Toplam Borç</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17l-4 4m0 0l-4-4m4 4V3" />
                    </svg>
                </div>
                <div class="text-base sm:text-xl font-black text-[#1b4965]">
                    {{ apartment.total_debt|floatformat:2|intcomma }} ₺
                </div>
            </div>

            <div class="p-3 badge-payment rounded-2xl border border-[#62b6cb]/30">
                <div class="flex items-center justify-between text-[#2d7587] mb-1">
                    <span class="text-[11px] uppercase font-bold">Toplam Ödeme</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7l4-4m0 0l4 4m-4-4v18" />
                    </svg>
                </div>
                <div class="text-base sm:text-xl font-black text-[#2d7587]">
                    {{ apartment.total_payment|floatformat:2|intcomma }} ₺
                </div>
            </div>
        </div>
    </div>
</div>
