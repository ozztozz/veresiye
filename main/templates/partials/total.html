{% load humanize %}
<div class="glass-card ui-rounded-3xl ui-border ui-border-62b6cb-20 ui-shadow-sm ui-overflow-hidden">
    <div class="card-body ui-p-3-5 ui-sm-p-5">
        <div class="ui-flex ui-items-center ui-justify-between">
            <div class="ui-flex ui-items-center ui-gap-3">
                <div class="ui-w-12 ui-h-12 ui-rounded-2xl ui-bg-gradient-to-tr ui-from-1b4965 ui-to-5fa8d3 ui-text-white ui-flex ui-items-center ui-justify-center ui-font-black ui-text-lg ui-shadow-sm ui-border ui-border-white-20">
                    {{ apartment.number }}
                </div>
                <div>
                    <h2 class="ui-text-lg ui-sm-text-xl ui-font-black ui-text-1b4965 ui-leading-tight">Daire {{ apartment.number }}</h2>
                    <p class="ui-text-xs ui-text-1b4965-60 ui-font-medium">Bakiye & Aidat Durumu</p>
                </div>
            </div>
            
            <div class="ui-text-right">
                <span class="ui-text-11px ui-uppercase ui-font-bold ui-text-1b4965-60 ui-block">Güncel Bakiye</span>
                <span class="ui-text-lg ui-sm-text-2xl ui-font-black {% if apartment.total_balance > 0 %}text-debt{% elif apartment.total_balance < 0 %}text-payment{% else %}ui-text-1b4965{% endif %}">
                    {{ apartment.total_balance|floatformat:2|intcomma }} ₺
                </span>
            </div>
        </div>
        
        <div class="divider ui-my-1-5 ui-opacity-20"></div>
        
        <!-- Stats Grid (Mobile 2-column) -->
        <div class="ui-grid ui-grid-cols-2 ui-gap-2-5">
            <div class="ui-p-3 badge-debt ui-rounded-2xl ui-border ui-border-1b4965-20">
                <div class="ui-flex ui-items-center ui-justify-between ui-text-1b4965 ui-mb-1">
                    <span class="ui-text-11px ui-uppercase ui-font-bold">Toplam Borç</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-4 ui-w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 17l-4 4m0 0l-4-4m4 4V3" />
                    </svg>
                </div>
                <div class="ui-text-base ui-sm-text-xl ui-font-black ui-text-1b4965">
                    {{ apartment.total_debt|floatformat:2|intcomma }} ₺
                </div>
            </div>

            <div class="ui-p-3 badge-payment ui-rounded-2xl ui-border ui-border-62b6cb-30">
                <div class="ui-flex ui-items-center ui-justify-between ui-text-2d7587 ui-mb-1">
                    <span class="ui-text-11px ui-uppercase ui-font-bold">Toplam Ödeme</span>
                    <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-4 ui-w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7l4-4m0 0l4 4m-4-4v18" />
                    </svg>
                </div>
                <div class="ui-text-base ui-sm-text-xl ui-font-black ui-text-2d7587">
                    {{ apartment.total_payment|floatformat:2|intcomma }} ₺
                </div>
            </div>
        </div>
    </div>
</div>
