<div id="transaction_modal" class="modal modal-open">
	<div class="modal-box w-11/12 max-w-2xl">

			<div class=" card bg-accent rounded-box text-2xl text-white  h-20 place-items-center">
			<div class="flex flex-col items-center justify-center">
				<div class="font-bold text-lg">{{ transaction.apartment.number }} </div>
				<div class="font-bold text-lg">{{transaction.amount }} </div>
				<div class="font-bold text-lg">{{ transaction.description }}</div>
				<div class="font-bold text-lg">{{transaction.updated_at|date:"d.m.Y H:i" }}</div>
			
			</div>
			</div>

			
	

		
		<form  class="space-y-4" method="post" action="{% url 'main:htmx_transaction_update' transaction_id=transaction.id transaction_type=transaction_type %}">
            {% csrf_token %}
			{% if transaction_type == 'delete' %}
				<input type="text" name="transaction_id" value="{{ transaction.id }}" hidden>
				<input type="text" name="active" value="False" hidden>

				<div class="card bg-red-100 rounded-box text-2xl text-red-600 grid h-20 place-items-center">
				Bu işlemi silmek istediğinize emin misiniz?</div>

										<div class="justify-between flex">	
							<button type="button" class="btn" onclick="document.getElementById('transaction_modal').remove()">İptal</button>
							<button type="submit" class="btn btn-primary">Sil</button>

						</div>
			{% endif %}
			{% if transaction_type == 'update' %}
			<input type="text" name="transaction_id" value="{{ transaction.id }}" hidden>
			
				<div class="form-control w-full">
				<label class="label">
					<span class="label-text">Miktar</span>
				</label>
				<input type="number" name="amount" step="0.01" 
				value='{{transaction.amount}}' 
				class="input input-bordered w-full" required />
			</div>
		
			<div class="form-control w-full">
				<label class="label">
					<span class="label-text">Açıklama</span>
				</label>
					<textarea name="description" class="textarea textarea-bordered" placeholder="İşlem açıklaması"></textarea>
						</div>
						<div class="justify-between flex">	
							<button type="button" class="btn" onclick="document.getElementById('transaction_modal').remove()">İptal</button>
							<button type="submit" class="btn btn-primary">Güncelle</button>

						</div>
			{% endif %}


				</form>
			</div>

	<form method="dialog" class="modal-backdrop">
		<button onclick="document.getElementById('transaction_modal').remove()">close</button>
	</form>
</div>
