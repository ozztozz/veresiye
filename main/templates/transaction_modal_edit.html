<!-- Transaction Edit Modal -->
<div id="transaction-modal" class="modal modal-open">
  <div class="modal-box w-full max-w-md">
    <button onclick="closeModal()" class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
    <h3 class="font-bold text-lg mb-4">İşlemi Düzenle</h3>
    
    <form 
      method="post" 
      hx-post="{% url 'main:transaction_update' transaction.id %}"
      hx-on::afterRequest="if(event.detail.xhr.status === 200) { closeModal(); htmx.ajax('GET', '{% url 'main:transaction_list_ajax' %}', '#transactions-list'); }"
      class="space-y-4"
    >
      {% csrf_token %}
      
      <div class="form-control">
        <label class="label">
          <span class="label-text">Daire Numarası</span>
        </label>
        <input 
          type="text" 
          name="apartment" 
          placeholder="Daire no." 
          class="input input-bordered" 
          value="{{ transaction.apartment }}"
          required 
          maxlength="5"
        />
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Tutar</span>
        </label>
        <input 
          type="number" 
          name="amount" 
          placeholder="0.00" 
          class="input input-bordered" 
          value="{{ transaction.amount }}"
          required 
          step="0.01"
          min="0"
        />
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Ödeme Yöntemi</span>
        </label>
        <select name="payment_method" class="select select-bordered">
          <option value="">Yöntemi Seçin</option>
          <option value="cash" {% if transaction.payment_method == 'cash' %}selected{% endif %}>Nakit</option>
          <option value="credit_card" {% if transaction.payment_method == 'credit_card' %}selected{% endif %}>Kredi Kartı</option>
          <option value="bank_transfer" {% if transaction.payment_method == 'bank_transfer' %}selected{% endif %}>Banka Transferi</option>
        </select>
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Ödendi</span>
        </label>
        <input 
          type="checkbox" 
          name="paid" 
          class="checkbox checkbox-primary"
          {% if transaction.paid %}checked{% endif %}
        />
      </div>

      <div class="form-control">
        <label class="label">
          <span class="label-text">Açıklama</span>
        </label>
        <textarea 
          name="description" 
          placeholder="Notlar..." 
          class="textarea textarea-bordered h-24"
        >{{ transaction.description }}</textarea>
      </div>

      <div class="modal-action">
        <button type="button" onclick="closeModal()" class="btn btn-ghost">
          İptal
        </button>
        <button 
          type="submit" 
          class="btn btn-primary"
          hx-indicator=".htmx-request .spinner"
        >
          <span class="spinner htmx-request:hidden">Güncelle</span>
          <span class="htmx-request:inline hidden">Güncelleniyor...</span>
        </button>
      </div>
    </form>
  </div>
  <form method="dialog" class="modal-backdrop" onclick="closeModal()"></form>
</div>

<script>
  function closeModal() {
    const modal = document.getElementById('transaction-modal');
    if (modal) modal.classList.remove('modal-open');
  }
</script>
