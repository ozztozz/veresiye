{% extends "base.html" %}
{% block title %}Daire {{ apartment.number }} - Veresiye{% endblock %}

{% block content %}
<div class="ui-max-w-7xl ui-mx-auto ui-space-y-4 ui-sm-space-y-6">

    <!-- Mobile-First Navigation & Title Bar -->
    <div class="ui-flex ui-items-center ui-justify-between ui-gap-2">
        <button onclick="window.history.length > 1 ? window.history.back() : window.location.href='/'" 
                class="btn btn-ghost btn-sm ui-sm-btn-md ui-gap-1-5 ui-px-3 ui-rounded-2xl app-touch-active ui-text-1b4965">
            <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-5 ui-w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
            </svg>
            <span class="ui-font-bold ui-text-sm">Geri</span>
        </button>

        <div class="ui-flex ui-items-center ui-gap-2">
            <span class="badge badge-debt ui-font-black ui-px-3-5 ui-py-3 ui-text-sm ui-rounded-xl">
                Daire {{ apartment.number }}
            </span>
        </div>
    </div>

    <!-- Apartment Stats Card -->
    <div id="total_stat" class="ui-w-full">{% include "partials/total.html" %}</div>
    
    <!-- Fast Action Buttons (Thumb-friendly for Mobile) -->
    <div class="glass-card ui-rounded-3xl ui-border ui-border-62b6cb-20 ui-shadow-xs">
        <div class="card-body ui-p-3-5 ui-sm-p-4">
            <div class="ui-flex ui-flex-col ui-sm-flex-row ui-items-stretch ui-sm-items-center ui-justify-between ui-gap-3">
                <h2 class="card-title ui-text-base ui-sm-text-lg ui-font-bold ui-flex ui-items-center ui-gap-2 ui-text-1b4965">
                    <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-5 ui-w-5 ui-text-3c9cb5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                    </svg>
                    Hızlı İşlem Ekle
                </h2>
                
                <div class="ui-grid ui-grid-cols-2 ui-gap-2-5 ui-sm-flex ui-sm-items-center">
                    <button class="btn btn-debt btn-sm ui-sm-btn-md ui-gap-1-5 ui-rounded-xl ui-shadow-xs app-touch-active ui-flex-1 ui-sm-flex-initial" 
                        hx-get="{% url 'main:htmx_transaction_create' apartment_number=apartment.number transaction_type='debt' %}" 
                        hx-target="body" 
                        hx-swap="beforeend">
                        <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-4 ui-w-4 ui-sm-h-5 ui-sm-w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Yeni Borç</span>
                    </button>
                    
                    <button class="btn btn-payment btn-sm ui-sm-btn-md ui-gap-1-5 ui-rounded-xl ui-shadow-xs app-touch-active ui-flex-1 ui-sm-flex-initial" 
                        hx-get="{% url 'main:htmx_transaction_create' apartment_number=apartment.number transaction_type='payment' %}" 
                        hx-target="body" 
                        hx-swap="beforeend">
                        <svg xmlns="http://www.w3.org/2000/svg" class="ui-h-4 ui-w-4 ui-sm-h-5 ui-sm-w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        <span>Yeni Ödeme</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Transaction Table -->
    <div id="transaction_table">{% include "partials/transaction_table.html" %}</div>

</div>
{% endblock content %}
