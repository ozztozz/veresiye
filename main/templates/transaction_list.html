<!-- Transaction List (HTMX Row-Based) -->
<div class="overflow-x-auto">
  <table class="table table-zebra w-full">
    <thead>
      <tr>
        <th>Daire</th>
        <th>Tutar</th>
        <th>Yöntemi</th>
        <th>Durum</th>
        <th>Tarih</th>
        <th>İşlemler</th>
      </tr>
    </thead>
    <tbody id="transactions-body">
      {% for transaction in transactions %}
        {% include "transaction_row.html" %}
      {% empty %}
        <tr>
          <td colspan="6" class="text-center py-8 text-gray-500">
            İşlem bulunamadı. 
            <button 
              class="link"
              hx-get="{% url 'main:transaction_form' %}"
              hx-target="#modal-container"
              hx-swap="innerHTML"
              hx-on::afterSettle="document.getElementById('transaction-modal').classList.add('modal-open')"
            >
              Yeni bir tane oluşturun
            </button>
          </td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
